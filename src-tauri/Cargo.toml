[package]
name = "home-cleaner"
version = "0.1.0"
description = "Outil de nettoyage local du dossier home"
authors = ["raantss"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "home_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rayon = "1"
walkdir = "2"
trash = "5"
chrono = { version = "0.4", features = ["clock"] }
dirs = "5"
quick-xml = "0.36"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
